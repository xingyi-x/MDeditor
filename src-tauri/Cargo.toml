[package]
name = "mdeditor"
version = "1.6.1"
description = "本地 Markdown 阅读与排版编辑器"
authors = ["local"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"

# ── 文档转换（PDF / Word / Excel / PPT / HTML → Markdown） ──
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["encoding"] }
pdf-extract = "0.7"
lopdf = "0.34"
png = "0.17"
flate2 = "1"
regex = "1"
# CMYK / YCCK JPEG 需要真正解码后重编码成 PNG，否则预览颜色反相
jpeg-decoder = "0.3"

# ── PDF 导出：直接调 WebView2 的 PrintToPdf（关掉页眉页脚） ──
# 版本必须与 tauri/wry 传递依赖一致，否则 ICoreWebView2* 之类的
# COM 接口类型不互通（cast 会编译失败）
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# 显式声明用到的 feature：CreateMutexW 被 Win32_Security 门控，
# 只靠 tauri 的传递 feature 聚合会在不同依赖版本下失效。
# 命名管道（单实例文件转发）另需 Pipes / Storage_FileSystem / System_IO：
# CreateNamedPipeW 要 Pipes + Storage_FileSystem，ConnectNamedPipe/ReadFile/WriteFile
# 的 OVERLAPPED 参数要 System_IO，缺一个都编译不过。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 不能开 panic = "abort"：pdf-extract 对畸形 PDF 会 panic，
# 只有可 unwind 才能用 catch_unwind 兜住、保留已解析的部分内容
codegen-units = 1
lto = true
opt-level = "s"
strip = true
