[package]
name = "mdeditor"
version = "0.2.0"
description = "本地 Markdown 阅读与排版编辑器"
authors = ["local"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
base64 = "0.22"

# ── 文档转换（PDF / Word / Excel / PPT / HTML → Markdown） ──
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["encoding"] }
pdf-extract = "0.7"
lopdf = "0.34"
png = "0.17"
flate2 = "1"
regex = "1"

[profile.release]
# 不能开 panic = "abort"：pdf-extract 对畸形 PDF 会 panic，
# 只有可 unwind 才能用 catch_unwind 兜住、保留已解析的部分内容
codegen-units = 1
lto = true
opt-level = "s"
strip = true
