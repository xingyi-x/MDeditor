# Cargo build settings shared by this repo.
# Do NOT force a crates.io mirror here: overseas users and CI may be slowed down
# or fail entirely. If you need a domestic mirror, add it locally (see README):
#
# [source.crates-io]
# replace-with = "rsproxy-sparse"
#
# [source.rsproxy-sparse]
# registry = "sparse+https://rsproxy.cn/index/"

[net]
retry = 3
