name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 编译与单元测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --locked --bin mdeditor

  frontend:
    name: 前端 JS 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: node --check
        run: |
          fail=0
          for f in app/js/*.js; do
            if ! node --check "$f"; then
              echo "::error file=$f::语法检查失败"
              fail=1
            fi
          done
          exit $fail
